name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Unit tests and shared protocol fixtures
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  dotnet:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      # A project that exists on disk but not in the solution would silently
      # never be built or tested. That already happened once, so it is checked
      # rather than remembered.
      - name: Every Windows project is in the solution
        shell: pwsh
        run: ./scripts/verify-solution-complete.ps1
      - name: Restore
        run: dotnet restore windows/PanelOS.sln
      - name: Build
        run: dotnet build windows/PanelOS.sln --no-restore
      - name: Test and shared protocol fixtures
        run: dotnet test windows/PanelOS.sln --no-build

  cross-language-live-session:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        shell: pwsh
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: C# host to Kotlin client over loopback
        shell: pwsh
        run: ./scripts/run-cross-language-live-session.ps1
      - name: Embedded host/APK identity diagnostics
        shell: pwsh
        run: |
          ./gradlew.bat assembleDebug
          ./scripts/verify-build-identity.ps1 -IntendedApkBuildIdentity 'PanelHome/1.0+1'

  android-instrumented-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Activity and Service smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

  # PanelDisplayDriver is intentionally excluded: it needs the repository's
  # documented Windows SDK/WDK 10.0.28000 toolchain and a dedicated runner.
