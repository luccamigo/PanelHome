name: Release

# Roda quando alguém envia uma tag de versão, por exemplo v1.0.0.
# Resultado: um Release em RASCUNHO com ZIP do Windows, APK e SHA256SUMS.txt.
# Nada é publicado até uma pessoa clicar em "Publish release" no GitHub.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Unit tests and shared protocol fixtures
        run: ./gradlew testDebugUnitTest

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore windows/PanelOS.sln
      - name: Build
        run: dotnet build windows/PanelOS.sln --no-restore
      - name: Test and shared protocol fixtures
        run: dotnet test windows/PanelOS.sln --no-build

  build-apk:
    needs: [test-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
      - name: Sign APK with the repository secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS ou ANDROID_KEY_PASSWORD. Veja docs/RELEASING.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          unsigned="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/PanelOS-${GITHUB_REF_NAME}.apk" \
            "$unsigned"
          certs="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/PanelOS-${GITHUB_REF_NAME}.apk")"
          echo "$certs"
          if echo "$certs" | grep -qi "Android Debug"; then
            echo "::error::O APK foi assinado com uma chave de debug. Releases públicos exigem a chave própria. Veja docs/RELEASING.md."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  build-windows:
    needs: [test-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Package Windows ZIP (without PawnIO)
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutputZip "dist/PanelOS-$env:GITHUB_REF_NAME-windows.zip" -ExcludePawnIO
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  draft-release:
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA-256
        working-directory: dist
        run: sha256sum PanelOS-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "PanelOS $GITHUB_REF_NAME" \
            --generate-notes "${prerelease[@]}"
